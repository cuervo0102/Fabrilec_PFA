version: 2

models:
  - name: stg_raw_documents
    description: "Tender documents classified by type and extraction quality."
    columns:
      - name: id
        tests:
          - unique
          - not_null
      - name: tender_ref
        tests:
          - not_null
      - name: document_type
        tests:
          - not_null
          - accepted_values:
              values: ['CCTP', 'CCAG', 'CPS', 'RC', 'BORDEREAU_PRIX', 'AVIS', 'ACTE_ENGAGEMENT', 'DECLARATION_HONNEUR', 'PLAN_DE_CHARGE', 'AUTRE']
      - name: extraction_quality
        tests:
          - not_null
          - accepted_values:
              values: ['fiable', 'ocr_a_verifier', 'echec']